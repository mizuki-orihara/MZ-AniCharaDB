<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge Editor — MZ-AniCharaDB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg:        #0e0f11;
    --surface:   #161820;
    --border:    #2a2d38;
    --accent:    #5b8dee;
    --accent2:   #e05b8d;
    --text:      #d4d8e8;
    --text-dim:  #6b7094;
    --locked:    #2a2d38;
    --new:       #1a2f1a;
    --discard:   #2f1a1a;
    --merge:     #1a1f2f;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.6;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== サイドバー ===== */
  #sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  #sidebar-header .subtitle {
    font-size: 11px;
    color: var(--text-dim);
  }

  #card-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  #card-list::-webkit-scrollbar { width: 4px; }
  #card-list::-webkit-scrollbar-track { background: transparent; }
  #card-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .card-item {
    padding: 10px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }

  .card-item:hover { background: rgba(91,141,238,0.07); }

  .card-item.active {
    background: rgba(91,141,238,0.12);
    border-left-color: var(--accent);
  }

  .card-item.done {
    opacity: 0.4;
  }

  .card-item .work {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .card-item .name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-item .badge {
    display: inline-block;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-top: 3px;
    background: var(--merge);
    color: var(--accent);
    border: 1px solid var(--accent);
    opacity: 0.7;
  }

  .card-item.done .badge {
    background: var(--new);
    color: #5be05b;
    border-color: #5be05b;
  }

  /* ===== メインエリア ===== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #main-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }

  #main-header .card-id {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    flex: 1;
  }

  #btn-confirm {
    padding: 7px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.15s;
  }

  #btn-confirm:hover { opacity: 0.85; }
  #btn-confirm:disabled { opacity: 0.3; cursor: default; }

  /* ===== テーブルエリア ===== */
  #table-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }

  #table-wrap::-webkit-scrollbar { width: 4px; }
  #table-wrap::-webkit-scrollbar-track { background: transparent; }
  #table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    padding: 8px 12px;
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }

  thead th.col-key    { width: 18%; }
  thead th.col-main   { width: 33%; }
  thead th.col-merge  { width: 33%; }
  thead th.col-action { width: 16%; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:hover { background: rgba(255,255,255,0.02); }

  tbody tr.locked { background: rgba(42,45,56,0.4); }

  td {
    padding: 9px 12px;
    vertical-align: top;
  }

  td.key-cell {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  td.key-cell .key-path {
    color: var(--text);
    font-weight: 500;
  }

  td.key-cell .key-depth {
    color: var(--text-dim);
    font-size: 10px;
  }

  td.val-cell {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
  }

  td.val-cell.empty { color: var(--text-dim); font-style: italic; }

  td.val-cell pre {
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 120px;
    overflow-y: auto;
    background: rgba(0,0,0,0.2);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 10px;
  }

  td.val-cell pre::-webkit-scrollbar { width: 3px; }
  td.val-cell pre::-webkit-scrollbar-thumb { background: var(--border); }

  td.action-cell { vertical-align: middle; }

  .lock-icon {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-dim);
    font-size: 11px;
  }

  .radio-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 4px;
    transition: background 0.1s;
  }

  .radio-group label:hover { background: rgba(255,255,255,0.05); }

  .radio-group input[type=radio] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  .radio-group label.del { color: var(--accent2); }
  .radio-group input[type=radio].del { accent-color: var(--accent2); }

  .diff-badge {
    display: inline-block;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 6px;
    background: rgba(224,91,141,0.15);
    color: var(--accent2);
    border: 1px solid rgba(224,91,141,0.3);
    vertical-align: middle;
  }

  /* ===== 空状態 ===== */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    gap: 8px;
  }

  #empty-state .icon { font-size: 32px; }
  #empty-state p { font-size: 12px; }

  /* ===== トースト ===== */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
  }

  #toast.show { opacity: 1; }
  #toast.ok  { background: #1a3a1a; border: 1px solid #5be05b; color: #5be05b; }
  #toast.err { background: #3a1a1a; border: 1px solid var(--accent2); color: var(--accent2); }

  /* ===== ローディング ===== */
  #loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>

<!-- サイドバー -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>Merge Editor</h1>
    <div class="subtitle" id="list-count">読み込み中...</div>
  </div>
  <div id="card-list"></div>
</div>

<!-- メインエリア -->
<div id="main">
  <div id="main-header">
    <div class="card-id" id="current-card-id">—</div>
    <button id="btn-confirm" disabled>確定して送信</button>
  </div>
  <div id="loading">merge_group_list.json を読み込み中...</div>
  <div id="empty-state" style="display:none">
    <div class="icon">✦</div>
    <p>左のリストからカードを選択してください</p>
  </div>
  <div id="table-wrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th class="col-key">キー</th>
          <th class="col-main">mainDB 側</th>
          <th class="col-merge">merge 側</th>
          <th class="col-action">採用</th>
        </tr>
      </thead>
      <tbody id="diff-tbody"></tbody>
    </table>
  </div>
</div>

<!-- トースト -->
<div id="toast"></div>

<script>
// ===== 設定 =====
const GROUP_LIST_URL  = '../API/merge_group_list.json';
const BUILDER_URL     = './merge_builder.php';

// コア項目（変更不可）
const CORE_KEYS = new Set(['schema', 'uuid', 'content_hash', 'generated_at', 'branch', 'work', 'name']);

// ===== 状態 =====
let groupList   = [];
let currentIdx  = null;
let selections  = {};  // key_path => 'main' | 'merge' | 'del'

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded', async () => {
  await loadGroupList();
  document.getElementById('btn-confirm').addEventListener('click', onConfirm);
});

async function loadGroupList() {
  try {
    const res  = await fetch(GROUP_LIST_URL);
    groupList  = await res.json();
    renderSidebar();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
  } catch(e) {
    document.getElementById('loading').textContent = 'merge_group_list.json の読み込みに失敗しました。';
  }
}

// ===== サイドバー描画 =====
function renderSidebar() {
  const list = document.getElementById('card-list');
  const count = document.getElementById('list-count');
  count.textContent = `${groupList.length} 件のマージ待ち`;
  list.innerHTML = '';

  groupList.forEach((entry, i) => {
    const parts = entry.card_id.split('_');
    const branch = parts[parts.length - 1];
    const name   = parts[parts.length - 2] ?? '';
    const work   = parts.slice(0, -2).join('_');

    const el = document.createElement('div');
    el.className = 'card-item' + (entry._done ? ' done' : '');
    el.dataset.idx = i;
    el.innerHTML = `
      <div class="work">${escHtml(work)}</div>
      <div class="name">${escHtml(name)}</div>
      <div class="badge">${escHtml(branch)} ${entry._done ? '✓ 完了' : 'merge待ち'}</div>
    `;
    el.addEventListener('click', () => selectCard(i));
    list.appendChild(el);
  });
}

// ===== カード選択 =====
async function selectCard(idx) {
  currentIdx = idx;
  selections = {};

  // サイドバーのactive更新
  document.querySelectorAll('.card-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  const entry = groupList[idx];
  document.getElementById('current-card-id').textContent = entry.card_id;
  document.getElementById('btn-confirm').disabled = !!entry._done;

  // 両カードを読み込む
  const mainFile  = entry.maindb[0];
  const mergeFile = entry.merge[0];

  let mainCard  = null;
  let mergeCard = null;

  try {
    const [r1, r2] = await Promise.all([
      fetch(`../mainDB/${mainFile}`),
      fetch(`../03b_merge/${mergeFile}`)
    ]);
    mainCard  = await r1.json();
    mergeCard = await r2.json();
  } catch(e) {
    showToast('カードファイルの読み込みに失敗しました', 'err');
    return;
  }

  renderTable(mainCard, mergeCard);
}

// ===== テーブル描画 =====
function renderTable(mainCard, mergeCard) {
  const tbody = document.getElementById('diff-tbody');
  tbody.innerHTML = '';

  // フラット展開（header は別途処理）
  const mainFlat  = flattenObj(mainCard);
  const mergeFlat = flattenObj(mergeCard);

  // 全キーのunion
  const allKeys = new Set([...Object.keys(mainFlat), ...Object.keys(mergeFlat)]);

  // headerキーを先頭に、残りをソート
  const headerKeys = [...allKeys].filter(k => k.startsWith('header.'));
  const otherKeys  = [...allKeys].filter(k => !k.startsWith('header.')).sort();
  const orderedKeys = [...headerKeys, ...otherKeys];

  orderedKeys.forEach(keyPath => {
    const topKey  = keyPath.split('.')[0] === 'header'
      ? keyPath.split('.')[1]
      : keyPath.split('.')[0];
    const isCore  = CORE_KEYS.has(topKey);
    const mainVal = mainFlat[keyPath];
    const mergeVal = mergeFlat[keyPath];
    const isDiff  = JSON.stringify(mainVal) !== JSON.stringify(mergeVal);

    const tr = document.createElement('tr');
    if (isCore) tr.classList.add('locked');

    // デフォルト選択：mainを選択
    if (!isCore) {
      selections[keyPath] = 'main';
    }

    tr.innerHTML = `
      <td class="key-cell">
        <span class="key-path">${escHtml(keyPath)}</span>
        ${isDiff && !isCore ? '<span class="diff-badge">diff</span>' : ''}
      </td>
      <td class="val-cell ${mainVal === undefined ? 'empty' : ''}">${formatVal(mainVal)}</td>
      <td class="val-cell ${mergeVal === undefined ? 'empty' : ''}">${formatVal(mergeVal)}</td>
      <td class="action-cell">${isCore ? renderLock() : renderRadio(keyPath, isDiff)}</td>
    `;

    tbody.appendChild(tr);
  });

  document.getElementById('table-wrap').style.display = 'block';
  document.getElementById('empty-state').style.display = 'none';
}

function renderLock() {
  return `<span class="lock-icon">🔒 固定</span>`;
}

function renderRadio(keyPath, isDiff) {
  const esc = escHtml(keyPath);
  return `
    <div class="radio-group">
      <label>
        <input type="radio" name="${esc}" value="main" checked
          onchange="selections['${keyPath}']='main'"> mainDB
      </label>
      <label>
        <input type="radio" name="${esc}" value="merge"
          onchange="selections['${keyPath}']='merge'"> merge
      </label>
      <label class="del">
        <input type="radio" name="${esc}" value="del" class="del"
          onchange="selections['${keyPath}']='del'"> 削除
      </label>
    </div>
  `;
}

// ===== 確定送信 =====
async function onConfirm() {
  if (currentIdx === null) return;
  const entry = groupList[currentIdx];

  const payload = {
    card_id:    entry.card_id,
    maindb_file: entry.maindb[0],
    merge_file:  entry.merge[0],
    selections:  selections,
  };

  try {
    const res  = await fetch(BUILDER_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload),
    });
    const data = await res.json();

    if (data.status === 'ok') {
      groupList[currentIdx]._done = true;
      renderSidebar();
      document.getElementById('btn-confirm').disabled = true;
      showToast('確定しました: ' + (data.new_file ?? ''), 'ok');
    } else {
      showToast('エラー: ' + (data.message ?? '不明'), 'err');
    }
  } catch(e) {
    showToast('送信に失敗しました', 'err');
  }
}

// ===== ユーティリティ =====

/**
 * オブジェクトをフラットなkey_path => value に展開
 * 配列・深いオブジェクトはそのまま値として持つ
 */
function flattenObj(obj, prefix = '') {
  const result = {};
  for (const [k, v] of Object.entries(obj ?? {})) {
    const path = prefix ? `${prefix}.${k}` : k;
    if (v !== null && typeof v === 'object' && !Array.isArray(v)) {
      // 1段だけ展開（それ以上はJSONで表示）
      if (prefix === '') {
        Object.assign(result, flattenObj(v, path));
      } else {
        result[path] = v;
      }
    } else {
      result[path] = v;
    }
  }
  return result;
}

function formatVal(val) {
  if (val === undefined) return '<span style="color:var(--text-dim)">—</span>';
  if (val === null)      return '<span style="color:var(--text-dim)">null</span>';
  if (typeof val === 'object') {
    return `<pre>${escHtml(JSON.stringify(val, null, 2))}</pre>`;
  }
  return escHtml(String(val));
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  setTimeout(() => { el.className = ''; }, 3000);
}
</script>
</body>
</html>
