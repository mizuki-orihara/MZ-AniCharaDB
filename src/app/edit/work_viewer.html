<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Viewer ? MZ-AniCharaDB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg: #0e0f11;
            --surface: #161820;
            --border: #2a2d38;
            --accent: #5b8dee;
            --accent2: #e0a05b;
            --text: #d4d8e8;
            --text-dim: #6b7094;
            --missing: #2f1a1a;
            --present: #161820;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Noto Sans JP', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== サイドバー ===== */
        #sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

            #sidebar-header h1 {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--accent);
                margin-bottom: 4px;
            }

            #sidebar-header .subtitle {
                font-size: 11px;
                color: var(--text-dim);
            }

        #work-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

            #work-list::-webkit-scrollbar {
                width: 4px;
            }

            #work-list::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }

        .work-item {
            padding: 9px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .work-item:hover {
                background: rgba(91,141,238,0.07);
            }

            .work-item.active {
                background: rgba(91,141,238,0.12);
                border-left-color: var(--accent);
            }

            .work-item .work-name {
                font-size: 12px;
                font-weight: 500;
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                padding-right: 8px;
            }

            .work-item .chara-count {
                font-size: 10px;
                color: var(--text-dim);
                white-space: nowrap;
            }

        /* ===== メインエリア ===== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #main-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 16px;
        }

            #main-header .work-title {
                font-size: 13px;
                font-weight: 700;
                flex: 1;
            }

        /* フィルター */
        #filter-wrap {
            display: flex;
            gap: 8px;
            align-items: center;
        }

            #filter-wrap label {
                font-size: 11px;
                color: var(--text-dim);
                display: flex;
                align-items: center;
                gap: 4px;
                cursor: pointer;
            }

            #filter-wrap input[type=checkbox] {
                accent-color: var(--accent);
            }

        #key-filter {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 11px;
            width: 160px;
            outline: none;
        }

            #key-filter:focus {
                border-color: var(--accent);
            }

        /* ===== マトリクステーブル ===== */
        #matrix-wrap {
            flex: 1;
            overflow: auto;
        }

            #matrix-wrap::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            #matrix-wrap::-webkit-scrollbar-track {
                background: transparent;
            }

            #matrix-wrap::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 3px;
            }

        table {
            border-collapse: collapse;
            font-size: 11px;
            white-space: nowrap;
        }

        /* スティッキーヘッダー */
        thead th {
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 2;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            font-weight: 600;
            text-align: center;
            min-width: 120px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

            /* キー列をスティッキー */
            thead th:first-child,
            tbody td:first-child {
                position: sticky;
                left: 0;
                z-index: 3;
                background: var(--surface);
                border-right: 2px solid var(--border);
                text-align: left;
                min-width: 200px;
                max-width: 260px;
            }

            thead th:first-child {
                z-index: 4;
            }

        tbody tr {
            border-bottom: 1px solid var(--border);
        }

            tbody tr:hover {
                background: rgba(255,255,255,0.02);
            }

        tbody td {
            padding: 6px 12px;
            border-right: 1px solid var(--border);
            vertical-align: top;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

            tbody td:first-child {
                font-family: var(--mono);
                font-size: 10px;
                color: var(--text-dim);
            }

            tbody td.key-header {
                color: var(--text);
                font-weight: 500;
            }

            tbody td.missing {
                background: var(--missing);
                color: var(--text-dim);
                text-align: center;
                font-size: 10px;
            }

            tbody td.has-value {
                background: var(--present);
                color: var(--text);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

                tbody td.has-value.is-obj {
                    color: var(--text-dim);
                    font-style: italic;
                    font-size: 10px;
                }

        /* 欠損ハイライトモード */
        body.highlight-missing tbody td.missing {
            background: rgba(224, 91, 91, 0.18);
            color: #e05b5b;
        }

        /* ===== 空・ロード状態 ===== */
        #empty-state, #loading-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            gap: 8px;
        }

        .state-icon {
            font-size: 28px;
        }

        .state-msg {
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h1>Work Viewer</h1>
            <div class="subtitle" id="works-count">読み込み中...</div>
        </div>
        <div id="work-list"></div>
    </div>

    <div id="main">
        <div id="main-header">
            <div class="work-title" id="work-title">作品を選択してください</div>
            <div id="filter-wrap" style="display:none">
                <input type="text" id="key-filter" placeholder="キーで絞り込み...">
                <label>
                    <input type="checkbox" id="toggle-missing"> 欠損ハイライト
                </label>
                <label>
                    <input type="checkbox" id="toggle-missing-only"> 欠損キーのみ表示
                </label>
            </div>
        </div>

        <div id="loading-state">
            <div class="state-icon">?</div>
            <div class="state-msg">作品リストを読み込み中...</div>
        </div>
        <div id="empty-state" style="display:none">
            <div class="state-icon">?</div>
            <div class="state-msg">左のリストから作品を選択してください</div>
        </div>
        <div id="matrix-wrap" style="display:none">
            <table id="matrix-table">
                <thead id="matrix-head"></thead>
                <tbody id="matrix-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = './work_viewer_api.php';

        let currentWork = null;
        let matrixData = null;  // { charas, keys, matrix }
        let filteredKeys = [];

        // ===== 初期化 =====
        window.addEventListener('DOMContentLoaded', async () => {
            await loadWorks();

            document.getElementById('key-filter').addEventListener('input', applyFilter);
            document.getElementById('toggle-missing').addEventListener('change', e => {
                document.body.classList.toggle('highlight-missing', e.target.checked);
            });
            document.getElementById('toggle-missing-only').addEventListener('change', applyFilter);
        });

        // ===== 作品リスト読み込み =====
        async function loadWorks() {
            try {
                const res = await fetch(`${API_URL}?mode=works`);
                const data = await res.json();

                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('empty-state').style.display = 'flex';

                const list = document.getElementById('work-list');
                const count = document.getElementById('works-count');
                count.textContent = `${data.works.length} 作品`;

                data.works.forEach(w => {
                    const el = document.createElement('div');
                    el.className = 'work-item';
                    el.innerHTML = `
            <span class="work-name" title="${escHtml(w.work)}">${escHtml(w.work)}</span>
            <span class="chara-count">${w.count}キャラ</span>
          `;
                    el.addEventListener('click', () => selectWork(w.work, el));
                    list.appendChild(el);
                });
            } catch (e) {
                document.getElementById('loading-state').querySelector('.state-msg').textContent =
                    '読み込みに失敗しました';
            }
        }

        // ===== 作品選択 =====
        async function selectWork(work, el) {
            // アクティブ切り替え
            document.querySelectorAll('.work-item').forEach(e => e.classList.remove('active'));
            el.classList.add('active');

            document.getElementById('work-title').textContent = work;
            document.getElementById('matrix-wrap').style.display = 'none';
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('loading-state').style.display = 'flex';
            document.getElementById('loading-state').querySelector('.state-msg').textContent = 'マトリクスを読み込み中...';

            try {
                const res = await fetch(`${API_URL}?mode=matrix&work=${encodeURIComponent(work)}`);
                matrixData = await res.json();
                filteredKeys = [...matrixData.keys];

                renderMatrix();
                document.getElementById('filter-wrap').style.display = 'flex';
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('matrix-wrap').style.display = 'block';

                // フィルタリセット
                document.getElementById('key-filter').value = '';
                document.getElementById('toggle-missing-only').checked = false;
            } catch (e) {
                document.getElementById('loading-state').querySelector('.state-msg').textContent =
                    'マトリクスの読み込みに失敗しました';
            }
        }

        // ===== マトリクス描画 =====
        function renderMatrix() {
            const head = document.getElementById('matrix-head');
            const body = document.getElementById('matrix-body');
            const charas = matrixData.charas;  // card_id => name
            const matrix = matrixData.matrix;  // card_id => { key_path: value }

            head.innerHTML = '';
            body.innerHTML = '';

            const cardIds = Object.keys(charas);

            // ヘッダー行（キャラ名 → card_editorへリンク）
            const tr = document.createElement('tr');
            tr.innerHTML = `<th>キー</th>` +
                cardIds.map(id => {
                    const chara = matrixData.charas[id];
                    const name = typeof chara === 'object' ? chara.name : chara;
                    const filename = typeof chara === 'object' ? chara.filename : '';
                    const url = `./card_editor.html?filename=${encodeURIComponent(filename)}`;
                    return `<th title="${escHtml(id)}"><a href="${escHtml(url)}" target="_blank" style="color:inherit;text-decoration:underline dotted;cursor:pointer">${escHtml(name)}</a></th>`;
                }).join('');
            head.appendChild(tr);

            // データ行（キーごと）
            filteredKeys.forEach(key => {
                const row = document.createElement('tr');
                let keyCell = `<td class="key-header">${escHtml(key)}</td>`;
                let cells = cardIds.map(id => {
                    const flat = matrix[id] ?? {};
                    if (!(key in flat) || flat[key] === null || flat[key] === '') {
                        return `<td class="missing">?</td>`;
                    }
                    const val = flat[key];
                    if (typeof val === 'object') {
                        return `<td class="has-value is-obj">{…}</td>`;
                    }
                    return `<td class="has-value" title="${escHtml(String(val))}">${escHtml(String(val))}</td>`;
                });

                row.innerHTML = keyCell + cells.join('');
                body.appendChild(row);
            });
        }

        // ===== フィルター適用 =====
        function applyFilter() {
            if (!matrixData) return;

            const keyword = document.getElementById('key-filter').value.trim().toLowerCase();
            const missingOnly = document.getElementById('toggle-missing-only').checked;
            const cardIds = Object.keys(matrixData.charas);
            const matrix = matrixData.matrix;

            filteredKeys = matrixData.keys.filter(key => {
                // キーワードフィルター
                if (keyword && !key.toLowerCase().includes(keyword)) return false;

                // 欠損キーのみ：1人でも欠損しているキーを表示
                if (missingOnly) {
                    const hasMissing = cardIds.some(id => {
                        const flat = matrix[id] ?? {};
                        return !(key in flat) || flat[key] === null || flat[key] === '';
                    });
                    if (!hasMissing) return false;
                }

                return true;
            });

            renderMatrix();
        }

        // ===== ユーティリティ =====
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
